<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omnis Swarm — 3D Multi-Agent + Comms + AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #94a3b8; background: rgba(2,6,23,.82); border: 1px solid rgba(56,189,248,.25);
      border-radius: 10px; padding: 10px 14px; min-width: 220px;
      backdrop-filter: blur(8px);
    }
    #hud b { color: #e0f2fe; }
    #hud .ok { color: #34d399; }
    #hint {
      position: fixed; bottom: 12px; right: 12px; z-index: 10;
      font: 11px system-ui, sans-serif; color: #64748b;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>OMNIS SWARM</b></div>
    <div>agents <span id="n-agents">—</span> · tick <span id="tick">0</span></div>
    <div>msgs/s <span id="mps">0</span> · grid cells <span id="cells">0</span></div>
    <div>food known <span id="known" class="ok">0</span> · seeking <span id="seeking">0</span></div>
    <div style="margin-top:6px;opacity:.7">drag orbit · scroll zoom</div>
  </div>
  <div id="hint">Spatial hash · range-limited gossip · utility AI</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./swarm.js"></script>
</body>
</html>
