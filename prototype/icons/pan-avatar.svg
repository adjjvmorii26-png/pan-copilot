<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pan avatar">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .ring { fill: none; stroke: #1e3a5f; stroke-width: 1; opacity: 0.85;
      animation: breathe 3.2s ease-in-out infinite; transform-origin: 32px 32px; }
    .orbit { fill: none; stroke: #38bdf8; stroke-width: 0.7; opacity: 0.35;
      animation: spin 12s linear infinite; transform-origin: 32px 32px; }
    .orbit2 { animation-duration: 18s; animation-direction: reverse; opacity: 0.25; stroke: #7dd3fc; }
    .star { filter: url(#glow); }
    .s1 { animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation: twinkle 2.4s ease-in-out infinite 0.4s; }
    .s3 { animation: twinkle 2.4s ease-in-out infinite 0.8s; }
    .s4 { animation: twinkle 2.4s ease-in-out infinite 1.2s; }
    .core-dot { animation: pulse 2.8s ease-in-out infinite; transform-origin: 32px 32px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.06); opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  </style>
  <circle cx="32" cy="32" r="30" fill="#030712"/>
  <circle class="ring" cx="32" cy="32" r="26"/>
  <ellipse class="orbit" cx="32" cy="32" rx="22" ry="10"/>
  <ellipse class="orbit orbit2" cx="32" cy="32" rx="10" ry="22"/>
  <g stroke="#60a5fa" stroke-width="0.9" fill="none" opacity="0.55">
    <path d="M14 36 L24 18 L40 24 L50 14"/>
    <path d="M24 18 L32 34 L40 24"/>
    <path d="M32 34 L22 48 L42 52"/>
  </g>
  <g class="star" fill="#e0f2fe">
    <circle class="s1" cx="14" cy="36" r="1.6"/>
    <circle class="s2" cx="24" cy="18" r="2" fill="#7dd3fc"/>
    <circle class="s3" cx="40" cy="24" r="1.5"/>
    <circle class="s4" cx="50" cy="14" r="1.3"/>
    <circle class="s2" cx="22" cy="48" r="1.2"/>
    <circle class="s3" cx="42" cy="52" r="1.2"/>
  </g>
  <circle class="core-dot" cx="32" cy="34" r="5" fill="url(#core)" filter="url(#glow)"/>
</svg>
